[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemantic"
dynamic = ["version"]
description = "From a description of a system to a finished architecture plate (SVG and PNG)."
readme = "README.md"
requires-python = ">=3.9"
# Tested ranges. requirements.txt is generated from this list (see tests/test_repo.py); the skill's doctor reads it.
dependencies = [
  "playwright>=1.60,<2",
  "pyyaml>=6",
  "jsonschema>=4.17",
  "jinja2>=3.1",
  "pillow>=10",
  "fonttools>=4.40",
  "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
schemantic = "schemantic.cli:main"

[tool.setuptools.dynamic]
version = {attr = "schemantic.__version__"}

[tool.setuptools.packages.find]
include = ["schemantic*"]

[tool.setuptools.package-data]
schemantic = ["js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 145
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]   # short assigned lambdas read better than nested defs in the geometry helpers
