archetype: state-machine

layout:
  areas:
    - "first middle"
    - "failed last"
  start: first
  ends: [failed, last]

# A state is its title, and the subtitle says what holds in it. Give a state a card only for a thing the sources name there.
panels:
  - id: first
    title: "TODO: the state it starts in"
    subtitle: "TODO: what holds in this state"
    role: platform
  - id: middle
    title: "TODO: the state that follows"
    subtitle: "TODO: what holds in this state"
    role: platform
  - id: failed
    title: "TODO: a state it can end in"
    subtitle: "TODO: what holds in this state"
    role: external
  - id: last
    title: "TODO: a state it can end in"
    subtitle: "TODO: what holds in this state"
    role: platform

flows_mean: transition
flows:
  - {from: first, to: middle, label: "TODO: event", refs: ["notes: TODO"]}
  - {from: middle, to: first, label: "TODO: event back", refs: ["notes: TODO"]}
  - {from: middle, to: last, label: "TODO: event", refs: ["notes: TODO"]}
  - {from: first, to: failed, label: "TODO: event", refs: ["notes: TODO"]}
