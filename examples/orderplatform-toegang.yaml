# yaml-language-server: $schema=../schema/plate.schema.json
# Fictional example: a column-flow plate in Dutch with English technical terms.
canvas: {size: landscape-4x3, lang: nl, series: orderplatform, part: 2, of: 3}
topic: "Orderplatform na fase 2: toegang en data flow"
title: "Eén identity provider en één gateway bepalen wie wat bereikt"
subtitle: "Mensen loggen in via OIDC, systemen met service accounts; data delen loopt via het lakehouse"
archetype: column-flow

layout:
  areas:
    - "clients identity gateway services"
    - "data    data     data    data"
  column_widths: [1, 1.1, 1, 1.2]

panels:
  - id: clients
    title: "Clients en gebruikers"
    subtitle: "Wie het platform aanroept"
    role: external
    cards:
      - {icon: browser, name: "Webshop frontend", note: "leest de product catalog"}
      - {icon: device-mobile, name: "Mobile app", note: "iOS en Android, zelfde API"}
      - {icon: api, name: "Partner integraties", note: "B2B order API voor leveranciers"}
      - {icon: users, name: "Data engineers", note: "bouwen pipelines per domein"}
      - {icon: chart-bar, name: "Analisten", note: "rapporteren via de BI tool"}
    chips:
      - {kind: info, text: "Partners krijgen eigen client credentials"}

  - id: identity
    title: "Identity provider"
    subtitle: "OIDC voor mensen, service accounts voor systemen"
    role: platform
    cards:
      - {icon: key, name: "OIDC login", note: "SSO voor klanten en medewerkers"}
      - {icon: robot, name: "Service accounts", note: "één per service, geen gedeelde secrets"}
      - icon: file-search
        name: "Audit log"
        note: "elke token-uitgifte wordt gelogd"

    patterns:
      - type: matrix
        caption: "Wie mag wat"
        columns: ["Orders API", "Data (Gold)", "Beheer"]
        rows:
          - {name: "Klant", cells: [partial, none, none]}
          - {name: "Partner", cells: [partial, none, none]}
          - {name: "Engineer", cells: [full, full, partial]}
          - {name: "Analist", cells: [none, full, none]}
    chips:
      - {kind: info, text: "Klanten en medewerkers in aparte realms; audit log een jaar bewaard"}

  - id: gateway
    focus: true
    title: "API gateway"
    subtitle: "Authenticatie, rate limiting en routing"
    role: platform
    cards:
      - icon: shield-lock
        name: "Token validatie"
        note: "JWT check bij elke request"
        bullets: ["signing keys via JWKS, elk kwartier ververst", "verlopen tokens krijgen een 401"]
      - icon: gauge
        name: "Rate limiting"
        note: "beschermt services tegen pieken"
        status: new
        flag: {kind: warning, text: "Rate limits per tenant of per client?"}
      - icon: route
        name: "Routing"
        note: "per domein naar de juiste service"
        bullets: ["versie in het pad: /v1, /v2", "canary releases per service"]
      - {icon: eye, name: "Observability", note: "logs en traces per request"}

  - id: services
    title: "Domeinservices"
    subtitle: "Eén service per domein, elk met een eigen database"
    role: platform
    cards:
      - {icon: building-store, name: "Catalog", note: "producten en prijzen"}
      - {icon: shopping-cart, name: "Orders", note: "bestellingen en status"}
      - {icon: credit-card, name: "Payments", note: "betalingen via de PSP"}
      - {icon: truck, name: "Shipping", note: "verzending en tracking"}
      - {icon: user, name: "Customers", note: "profielen en adressen"}
      - {icon: bell, name: "Notifications", note: "e-mail en push", status: planned}
    chips:
      - {kind: warning, text: "Payments als eigen service of bij de PSP laten?"}

  - id: data
    title: "Data platform"
    subtitle: "Lakehouse met drie lagen, gevuld door pipelines per domein"
    role: data
    arrange: row
    weights: [1.35, 0.8, 1]   # tier strip, tree, cards
    patterns:
      - type: tier-strip
        tiers:
          - {tier: bronze, name: "Bronze", note: "raw events en CDC"}
          - {tier: silver, name: "Silver", note: "gestandaardiseerd"}
          - {tier: gold, name: "Gold", note: "curated per domein"}
      - type: tree
        caption: "Opslag (object storage)"
        lines:
          - "s3://orderplatform-prod/"
          - "  orders/"
          - "    bronze/  silver/  gold/"
          - "  payments/"
          - "    bronze/  silver/  gold/"
    cards:
      - {icon: stack-2, name: "Lakehouse catalog", note: "Iceberg tabellen per domein"}
      - {icon: git-branch, name: "Pipelines", note: "jobs per domein, gedeployed via CI/CD"}
    chips:
      - {kind: info, text: "Analisten en de BI tool lezen alleen Gold"}

flows_mean: request
flows:
  - {from: clients, to: identity}
  - {from: identity, to: gateway}
  - {from: gateway, to: services}
  - {from: clients, to: data, label: "BI en notebooks"}
  - {from: identity, to: data, label: "scoped credentials"}
  - {from: services, to: data, label: "events en CDC", style: async}

footer:
  context:
    title: "Rollen en samenwerking"
    card_columns: 2
    cards:
      - {icon: users, name: "Data engineer", note: "bouwt en onderhoudt pipelines"}
      - {icon: chart-bar, name: "Analist", note: "rapporteert op Gold"}
      - {icon: users-group, name: "Domeinteam", note: "eigenaar van service en data"}
      - {icon: tool, name: "Platformteam", note: "beheert gateway en lakehouse"}
  principles:
    - "Alleen pipelines schrijven naar productie; handmatige writes zijn niet toegestaan."
    - "Elke request draagt een token; zonder token weigert de gateway."
    - "Services delen geen database; data delen loopt via het lakehouse."
  open_questions: {from_chips: true, extra: ["Event bus nu of pas in fase 3?"]}
  legend: auto
