# yaml-language-server: $schema=../schema/plate.schema.json
# Fictional example: a hub-and-spokes plate in English, with a connector that starts at a card.
canvas: {size: landscape-4x3, lang: en, series: orderplatform, part: 3, of: 3}
topic: "Order platform after phase 3: the event bus"
title: "Each fact is published once and read from one bus"
subtitle: "Managed Kafka with one topic per event type; operations keeps it healthy and replays up to 14 days"
archetype: hub-and-spokes

layout:
  hub: bus
  top: [orders, payments, shipping]
  bottom: [search, analytics, notify]
  right: ops

panels:
  - id: bus
    title: "Event bus"
    subtitle: "Managed Kafka, one topic per event type"
    role: platform
    card_columns: 2
    cards:
      - {icon: stack-2, name: "Topics", note: "orders.placed, payments.captured, parcels.shipped"}
      - {icon: file-text, name: "Schema registry", note: "every event has a versioned schema"}
      - {icon: refresh, name: "Replay", note: "consumers rewind up to 14 days"}
      - {id: dlq, icon: alert-triangle, name: "Dead-letter queue", note: "events no consumer could handle"}
    patterns:
      - type: matrix
        caption: "Who reads which topic"
        key: {full: "reads all events", partial: "reads some", none: "does not read"}
        columns: ["orders.*", "payments.*", "parcels.*"]
        rows:
          - {name: "Search", cells: [full, none, full]}
          - {name: "Analytics", cells: [full, full, full]}
          - {name: "Notifications", cells: [full, partial, full]}
    chips:
      - {kind: warning, text: "Is 14 days of retention enough to rebuild the search index?"}

  - id: orders
    title: "Orders"
    role: platform
    cards:
      - {icon: shopping-cart, name: "Order service", note: "publishes OrderPlaced and OrderCancelled"}
  - id: payments
    title: "Payments"
    role: platform
    cards:
      - {icon: credit-card, name: "Payment service", note: "publishes PaymentCaptured"}
  - id: shipping
    title: "Shipping"
    role: platform
    cards:
      - {icon: truck, name: "Shipping service", note: "publishes ParcelShipped"}

  - id: search
    title: "Search"
    role: data
    cards:
      - {icon: file-search, name: "Search index", note: "rebuilt from replay, updated live"}
  - id: analytics
    title: "Analytics"
    role: data
    cards:
      - {icon: chart-bar, name: "Lakehouse ingest", note: "lands every event in Bronze"}
  - id: notify
    title: "Notifications"
    role: platform
    cards:
      - {icon: bell, name: "Notification service", note: "e-mail and push on status changes"}

  - id: ops
    title: "Operations"
    subtitle: "Who keeps the bus healthy"
    role: actor
    cards:
      - icon: gauge
        name: "Dashboards"
        note: "consumer lag per topic"
        bullets: ["alert when lag passes five minutes", "one board per consumer group"]
      - icon: headset
        id: oncall
        name: "On-call"
        note: "paged on dead letters"
        bullets: ["first responder replays or skips", "fixes go back to the owning domain"]
      - icon: file-text
        name: "Runbooks"
        note: "next to the bus configuration in Git"
        bullets: ["replay a topic from a timestamp", "skip one poison message"]
      - icon: cpu
        name: "Capacity"
        note: "partitions and brokers"
        bullets: ["partition count reviewed every quarter", "brokers scale ahead of peak season"]
    chips:
      - {kind: info, text: "Domains run their consumers; operations runs the bus"}

flows_mean: data
flows:
  - {from: orders, to: bus, style: async}
  - {from: payments, to: bus, style: async}
  - {from: shipping, to: bus, style: async}
  - {from: bus, to: search, style: async}
  - {from: bus, to: analytics, style: async}
  - {from: bus, to: notify, style: async}
  - {from: dlq, to: oncall}

footer:
  principles:
    - "An event is a fact that already happened; it is never changed afterwards."
    - "The producing domain owns the schema; consumers adapt to new versions."
    - "No consumer calls a producer directly to fetch what an event already carries."
  open_questions: {from_chips: true}
  legend: auto
